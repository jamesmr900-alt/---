name = "maytoni-agent"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://jamesmr900-alt.github.io"
MODEL = "claude-sonnet-5-5"
DAILY_LIMIT = "150"

# Общие лимиты по IP (необязательно): создайте KV и раскомментируйте
