<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maytoni · Ассистент-комплектатор</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23111%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%227%22 fill=%22%23b08d57%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css?v=202611222029">
</head>
<body>
<header class="top">
  <div class="logo">MAYTONI<span>комплектатор</span></div>
  <nav><a href="index.html" class="on">Ассистент (ИИ)</a><a href="tools.html">Инструменты</a></nav>
</header>
<main>
  <div id="banner"></div>
  <div class="chatwrap">
    <div class="chat">
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <div class="chips" id="atts"></div>
        <textarea id="inp" placeholder="Опишите объект: помещения, размеры, высота потолка, пожелания… Можно прикрепить план (PDF, фото) или КП (xlsx)."></textarea>
        <div class="row">
          <label class="b ghost sm" style="display:inline-flex;flex-direction:row;cursor:pointer;color:var(--ink)">📎 Файл<input type="file" id="file" multiple accept=".pdf,image/*,.xlsx,.xls,.csv,.txt,.ldt" hidden></label>
          <button class="b ghost sm" id="newChat">Новый диалог</button>
          <span class="mute" id="status" style="margin-left:auto"></span>
          <button class="b" id="send">Отправить</button>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="card">
        <div class="row" style="justify-content:space-between"><h3 style="margin:0" id="kpTitle">КП</h3>
          <div class="row"><button class="b sm" id="kpX">Скачать xlsx</button><button class="b ghost sm" id="kpClr">Очистить</button></div></div>
        <div id="kpBox" style="margin-top:8px"></div>
      </div>
      <div class="card" id="v3dCard" hidden><div class="row" style="justify-content:space-between"><h3 style="margin:0" id="v3dTitle">3D</h3><button class="b ghost sm" id="v3dClose">Скрыть</button></div><div id="v3d" style="margin-top:8px"></div><div id="v3dList" class="mute" style="margin-top:6px"></div></div>
      <div class="card"><h3>Расчёты</h3><div id="calcs"><p class="mute">Здесь появятся карты освещённости по помещениям.</p></div></div>
    </div>
  </div>
</main>

<script src="vendor/xlsx.full.min.js"></script>
<script src="js/config.js?v=202611222029"></script>
<script src="js/agent-def.js?v=202611222029"></script>
<script src="js/engine.js?v=202611222029"></script>
<script src="js/help.js?v=202611222029"></script>
<script src="js/help-content.js?v=202611222029"></script>
<script src="js/ui.js?v=202611222029"></script>
<script type="module" src="js/viz3d.js?v=202611222029"></script>
<script>
(async function () {
  'use strict';
  const { $, esc, kp } = MTUI;
  const CFG = window.MAYTONI_CONFIG || {};
  const API = (CFG.workerUrl || (/github\.io$/.test(location.hostname) || location.protocol === 'file:' ? '' : '/api')).replace(/\/+$/, '');
  const HKEY = 'maytoni_chat_v1';
  let history = [], log = [], atts = [], busy = false;

  /* ---------- Markdown (минимальный) ---------- */
  function md(src) {
    const lines = String(src).split('\n'); let out = '', i = 0, list = null;
    const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\(((?:https?:\/\/|[\w.-]+\.html)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    const close = () => { if (list) { out += `</${list}>`; list = null; } };
    while (i < lines.length) {
      const l = lines[i];
      if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        close(); const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        out += '<table><tr>' + cells(l).map(c => `<th>${inline(c)}</th>`).join('') + '</tr>'; i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { out += '<tr>' + cells(lines[i]).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>'; i++; }
        out += '</table>'; continue;
      }
      let m;
      if ((m = l.match(/^(#{1,4})\s+(.*)/))) { close(); out += `<p><b>${inline(m[2])}</b></p>`; }
      else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; }
      else if (!l.trim()) close();
      else { close(); out += `<p>${inline(l)}</p>`; }
      i++;
    }
    close(); return out;
  }

  /* ---------- Отрисовка ---------- */
  function add(kind, html, save = true) {
    const d = document.createElement('div'); d.className = 'msg ' + kind; d.innerHTML = html; $('#msgs').appendChild(d);
    $('#msgs').scrollTop = 1e9; if (save) { log.push([kind, html]); persist(); } return d;
  }
  function persist() {
    try {   // вложения (base64) не сохраняем — только текст
      const slim = history.map(m => ({ role: m.role, content: typeof m.content === 'string' ? m.content : m.content.map(b =>
        b.type === 'image' || b.type === 'document' ? { type: 'text', text: '[вложение было в исходном сообщении]' } : b) }));
      localStorage.setItem(HKEY, JSON.stringify({ history: slim, log: log.slice(-200) }));
    } catch (e) { }
  }
  function welcome() {
    add('a', md(`Здравствуйте! Я ассистент-комплектатор **Maytoni**. Подберу освещение по плану или размерам, посчитаю освещённость, найду аналоги и соберу КП — его можно скачать в xlsx из панели КП.\n\nОпишите объект или прикрепите план / готовое КП.`), false);
    const s = document.createElement('div'); s.className = 'suggest';
    ['Подобрать свет в гостиную 5,2×4,5 м, потолок ГКЛ 2,75 м, белые встраиваемые', 'Проверить моё КП по освещённости (прикреплю xlsx и план)',
      'Найти аналог для Reif DL048-01W под шпаклёвку', 'Покажи в 3D кухню-гостиную 6×4 м с подвесами над столом'].forEach(t => {
      const b = document.createElement('button'); b.textContent = t; b.onclick = () => { $('#inp').value = t; $('#inp').focus(); }; s.appendChild(b); });
    $('#msgs').appendChild(s);
  }

  /* ---------- Вложения ---------- */
  const b64 = buf => { let s = '', a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  async function imageBlock(file) {
    const img = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] } };
  }
  async function pdfAsImages(file) {
    if (!window.pdfjsLib) await new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'vendor/pdf.min.js'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    const N = Math.min(pdf.numPages, 8), blocks = [{ type: 'text', text: `Вложение: ${file.name} (большой PDF, страницы 1–${N} из ${pdf.numPages} картинками; текст страниц ниже)` }];
    let text = '';
    for (let p = 1; p <= pdf.numPages && p <= 40; p++) { const pg = await pdf.getPage(p); text += `\n--- стр. ${p} ---\n` + (await pg.getTextContent()).items.map(i => i.str).join(' '); }
    for (let p = 1; p <= N; p++) {
      const pg = await pdf.getPage(p), vp0 = pg.getViewport({ scale: 1 }), k = Math.min(2.5, 1500 / Math.max(vp0.width, vp0.height)), vp = pg.getViewport({ scale: k });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      blocks.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.6).split(',')[1] } });
    }
    blocks.push({ type: 'text', text: 'Текстовый слой PDF:' + text.slice(0, 30000) });
    return blocks;
  }
  async function toBlocks(file) {
    const name = file.name, low = name.toLowerCase();
    if (file.type.startsWith('image/')) return [{ type: 'text', text: `Вложение: ${name}` }, await imageBlock(file)];
    if (low.endsWith('.pdf')) {
      if (file.size <= 2.8e6) return [{ type: 'text', text: `Вложение: ${name}` }, { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: b64(await file.arrayBuffer()) } }];
      return await pdfAsImages(file);      // большой PDF — страницы картинками (лимит запроса 4,5 МБ)
    }
    if (/\.(xlsx|xls|csv)$/.test(low)) {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      let txt = wb.SheetNames.map(n => `Лист «${n}»:\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n], { FS: ' | ', blankrows: false })).join('\n\n');
      if (txt.length > 60000) txt = txt.slice(0, 60000) + '\n…(обрезано)';
      const rows = MT.kpFromSheet(XLSX, wb);
      return [{ type: 'text', text: `Вложение: таблица ${name}${rows.length ? ` (распознано строк КП: ${rows.length})` : ''}\n${txt}` }];
    }
    if (low.endsWith('.ldt')) {
      const t = await file.text(); let info = '';
      try { const l = MT.parseLDT(t); info = `\nРазбор: ${l.name}, LOR ${l.LOR}, угол ≈ ${l.beam}°, лампа ${l.lampFlux} лм.`; } catch (e) { }
      return [{ type: 'text', text: `Вложение: КСС ${name}${info}\n${t.slice(0, 4000)}` }];
    }
    return [{ type: 'text', text: `Вложение: ${name}\n${(await file.text()).slice(0, 40000)}` }];
  }
  function drawAtts() { $('#atts').innerHTML = atts.map((a, i) => `<span class="chip">${esc(a.name)}<button data-i="${i}">✕</button></span>`).join('');
    $('#atts').querySelectorAll('button').forEach(b => b.onclick = () => { atts.splice(+b.dataset.i, 1); drawAtts(); }); }
  $('#file').onchange = e => { for (const f of e.target.files) atts.push(f); e.target.value = ''; drawAtts(); };

  /* ---------- Инструменты (выполняются в браузере) ---------- */
  const short = x => x && { article: x.a, name: x.n, group: x.g, type: x.t, series: x.se, color: x.col, W: x.w, lm: x.lm, angle: x.ang, K: x.k, IP: x.ip, cap: x.cap,
    price_rub: x.p || null, status: x.st, size_mm: [x.h, x.dm || x.l, x.wd].filter(Boolean).join('×') || undefined, dimming: x.dim, control: x.ctl };
  const CALCS = {}; let view3d = null;
  function addCalcCard(calc, title) {
    CALCS[String(title).toLowerCase()] = calc;
    const box = $('#calcs'); if (box.querySelector('p.mute')) box.innerHTML = '';
    const d = document.createElement('div'); d.style.marginBottom = '14px';
    d.innerHTML = `<b>${esc(title)}</b>${MTUI.calcHTML(calc)}<canvas class="map"></canvas><div class="legend">меньше <i></i> больше</div>`;
    box.prepend(d); MTUI.drawMap(d.querySelector('canvas'), calc, title);
    while (box.children.length > 12) box.lastChild.remove();
  }
  const zoneCalc = (z, alt) => {
    const L = z.length || (z.area ? Math.sqrt(z.area * 1.3) : 0), W = z.width || (z.area ? z.area / L : 0);
    const base = { room: z.room, L, W, H: z.height || 2.75, E: z.target_lux, existing: z.count };
    const r = { room: z.room, area: +(L * W).toFixed(1) };
    if (!(L > 0 && W > 0)) return Object.assign(r, { error: 'нет размеров' });
    try { if (z.source || z.source_flux) { const c = MTUI.roomCalc(Object.assign({}, base, { fixture: z.fixture, source: z.source, lm: z.source_flux, ang: z.source_angle }));
      r.now = { fixture: z.fixture, source: z.source || 'вручную', count: z.count, E: Math.round(c.pick.E), required: c.pick.Nreq, meets_norm: c.ok }; r.target = c.R.E; } } catch (e) { r.now = { error: e.message }; }
    try { const c = MTUI.roomCalc(Object.assign({}, base, { fixture: z.fixture })); r.target = c.R.E;
      r.v1 = { fixture: z.fixture, source: c.pick.src.a, count: c.pick.n, required: c.pick.Nreq, E: Math.round(c.pick.E), meets_norm: c.ok }; } catch (e) { r.v1 = { error: e.message }; }
    const fx = MT.get(z.fixture), pr = fx ? MT.fixtureProfile(fx) : null, a = pr && (pr.mount === 'deep' ? alt.deep : pr.mount === 'shallow' ? alt.shallow : null);
    try { const c = MTUI.roomCalc(Object.assign({}, base, { fixture: a && MT.get(a) ? a : z.fixture }));
      r.v2 = { fixture: c.fixture?.a || z.fixture, source: c.pick.src.a, count: c.pick.n, required: c.pick.Nreq, E: Math.round(c.pick.E), meets_norm: c.ok, replaced: !!a };
      if (r.v2.replaced) addCalcCard(c, `${z.room} · V2`); } catch (e) { r.v2 = { error: e.message }; }
    return r;
  };
  const TOOLS = {
    search_catalog: i => MT.search(i.query || '', { group: i.group, kind: i.kind, cap: i.cap, color: i.color, ip: i.ip_min, maxPrice: i.max_price, priced: i.priced_only !== false },
      Math.min(i.limit || 15, 40)).map(short),
    get_items: i => (i.articles || []).slice(0, 60).map(a => short(MT.get(a)) || { article: a, error: 'нет в каталоге' }),
    find_analogs_by_description: i => { const r = MT.analogsBySpec(String(i.description || ''), Math.min(i.limit || 6, 15));
      return { type: r.kind || null, features: r.features, note: r.note || undefined, analogs: (r.list || []).map(o => Object.assign(short(o.item), { exact: o.exact, score: o.score, matches: o.why, critical_differences: o.hard, other_differences: o.soft })) }; },
    find_analogs: i => { const r = MT.analogs(i.article, Math.min(i.limit || 8, 20), { sameSeries: i.other_series_only ? false : true });
      return r.base ? { base: short(r.base), type: r.kind, features: r.features, note: r.note || undefined, analogs: r.list.map(o => Object.assign(short(o.item), { exact: o.exact, score: o.score, matches: o.why, critical_differences: o.hard, other_differences: o.soft })) } : { error: 'артикул не найден' }; },
    list_norms: () => MT.NORMS,
    room_calc: i => { const c = MTUI.roomCalc({ room: i.room, L: i.length, W: i.width, H: i.height, E: i.target_lux, fixture: i.fixture && MT.get(i.fixture) ? i.fixture : null,
      mount: i.mount, cap: i.cap, existing: i.existing_count, source: i.source, lm: i.source_flux, ang: i.source_angle, Ke: i.maintenance_factor, dimmable: i.dimmable });
      addCalcCard(c, i.room); const s = c.summary; if (i.fixture && !MT.get(i.fixture)) s.note = 'светильника нет в каталоге — посчитано по типу установки'; return s; },
    check_kp_zones: i => { const alt = { deep: i.alt_deep || 'DL042-01-RD-W', shallow: i.alt_shallow || 'DL101-GU10-TRS-W' };
      const res = (i.zones || []).map(z => zoneCalc(z, alt));
      return { rules: 'Kз 0,8; отражения 70/50/20; количество ≥ 70% от КП', zones: res }; },
    show_3d: i => {
      if (!window.MT3D) throw new Error('3D-модуль ещё загружается, повторите');
      const key = String(i.from_calc || i.title || '').toLowerCase();
      const calc = CALCS[key] || Object.entries(CALCS).find(([k]) => key && (k.includes(key) || key.includes(k)))?.[1];
      let scene;
      if ((!i.luminaires || !i.luminaires.length) && calc) scene = MT3D.sceneFromCalc(calc, { title: i.title || calc.summary.room });
      else {
        const rm = i.room || (calc ? { width: calc.grid.W, length: calc.grid.L, height: calc.R.H } : null);
        if (!rm || !rm.length || !rm.width) throw new Error('нужны размеры помещения (room.length, room.width, room.height) или предварительный room_calc');
        scene = { title: i.title, room: { length: rm.length, width: rm.width, height: rm.height || 2.7, wall: rm.wall_color, floor: rm.floor_color }, luminaires: [] };
        if (calc && i.include_calc_layout) scene = Object.assign(MT3D.sceneFromCalc(calc), scene, { luminaires: MT3D.sceneFromCalc(calc).luminaires, heatmap: MT3D.sceneFromCalc(calc).heatmap });
        for (const l of i.luminaires || []) {
          const it = l.article ? MT.get(l.article) : null, src = l.source ? MT.get(l.source) : null;
          const kind = l.kind || (it ? ({ 'встраиваемый': 'recessed', 'подвесной': 'pendant', 'настенный': 'wall', 'трековый': 'track', 'трековый подвесной': 'pendant', 'накладной': 'surface', 'потолочный': 'surface', 'напольный': 'floor', 'настольный': 'table', 'лента': 'strip', 'линейный': 'strip' }[MT.kind(it)] || 'surface') : 'recessed');
          const lm = l.lm || (src && src.lm ? src.lm * MT.lorFor(it ? MT.fixtureProfile(it).mount : 'open', src.ang || 38) : it && it.lm ? it.lm : (it && it.w ? it.w * 80 : 600));
          scene.luminaires.push(Object.assign({}, l, { kind, name: l.name || (it && it.n) || '', color: l.color || (it && it.col) || 'white', lm, cct: l.cct || +(String((src || it || {}).k || '').match(/\d{4}/) || [3000])[0], beam: l.beam || (src && src.ang) || (it && it.ang) }));
        }
      }
      scene.furniture = i.furniture || scene.furniture || [];
      if (view3d) view3d.dispose();
      $('#v3dCard').hidden = false; $('#v3dTitle').textContent = '3D · ' + (scene.title || 'помещение');
      view3d = MT3D.render($('#v3d'), scene);
      const list = MT3D.expand(scene); const cnt = {}; list.forEach(l => { const k = (l.article || l.kind) + (l.name ? ' · ' + l.name : ''); cnt[k] = (cnt[k] || 0) + 1; });
      $('#v3dList').innerHTML = Object.entries(cnt).map(([k, n]) => esc(k) + ' × ' + n).join('<br>');
      $('#v3dCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return { shown: true, luminaires: view3d.luminaires, light_sources_rendered: view3d.lights, note: 'посетитель видит интерактивную 3D-сцену справа' };
    },
    kp_get: () => { const p = kp.priced(); return { title: kp.get().title, total_rub: p.total, missing_price: p.missing, rows: p.lines.map(l => ({ room: l.room, article: l.a, name: l.n, qty: l.qty, price: l.p, sum: l.sum })) }; },
    kp_set: i => { kp.set((i.rows || []).map(r => ({ room: r.room, a: r.article, qty: r.qty })), i.title); return TOOLS.kp_get(); },
    kp_add: i => { kp.add((i.rows || []).map(r => ({ room: r.room, a: r.article, qty: r.qty }))); return TOOLS.kp_get(); },
  };
  const TOOL_LABEL = { search_catalog: 'ищу в каталоге', get_items: 'проверяю артикулы', find_analogs: 'подбираю аналоги', find_analogs_by_description: 'подбираю аналоги по описанию', list_norms: 'смотрю нормы',
    room_calc: 'считаю освещённость', show_3d: 'строю 3D-визуализацию', check_kp_zones: 'проверяю КП по зонам', kp_get: 'смотрю КП', kp_set: 'собираю КП', kp_add: 'добавляю в КП' };

  /* ---------- Диалог ---------- */
  function askCode() {
    $('#banner').innerHTML = '<div class="note" style="margin-bottom:12px"><div class="row"><b>Код доступа к ассистенту</b><input id="codeIn" placeholder="код, который выдал администратор" style="flex:1;min-width:200px"><button class="b sm" id="codeOk">Сохранить</button></div></div>';
    $('#codeOk').onclick = () => { const c = $('#codeIn').value.trim(); if (c) { localStorage.setItem('maytoni_code', c); $('#banner').innerHTML = '<div class="note" style="margin-bottom:12px">Код сохранён — отправьте сообщение ещё раз.</div>'; } };
  }
  async function callModel() {
    const headers = { 'content-type': 'application/json' };
    const code = localStorage.getItem('maytoni_code'); if (code) headers['x-access-code'] = code;
    // лимит запроса ~4,5 МБ: старые вложения заменяем пометкой (модель их уже видела)
    let body = JSON.stringify({ messages: history });
    for (let i = 0; body.length > 4.2e6 && i < history.length - 1; i++) {
      const m = history[i]; if (m.role !== 'user' || !Array.isArray(m.content)) continue;
      if (m.content.some(b => b.type === 'image' || b.type === 'document')) {
        m.content = m.content.map(b => b.type === 'image' || b.type === 'document' ? { type: 'text', text: '[вложение было показано раньше]' } : b);
        body = JSON.stringify({ messages: history });
      }
    }
    if (body.length > 4.4e6) throw new Error('Слишком большие вложения: пришлите меньше файлов за раз или нужные страницы.');
    const r = await fetch(API + '/chat', { method: 'POST', headers, body });
    const j = await r.json().catch(() => ({ error: { message: 'Пустой ответ прокси (' + r.status + ')' } }));
    if (r.status === 401 && j.error && j.error.code === 'access') {
      localStorage.removeItem('maytoni_code'); askCode(); throw new Error(code ? 'Код доступа не подошёл. Введите другой код над чатом.' : 'Нужен код доступа — введите его над чатом.');
    }
    if (!r.ok || j.error) throw new Error((j.error && (j.error.message || j.error.type)) || ('HTTP ' + r.status));
    return j;
  }
  /* ---------- Режим «артефакт Claude»: запросы идут через аккаунт Claude того, кто открыл страницу ---------- */
  let SAMPLE = null, SLIM = null, cturns = [];
  const CKEY = 'maytoni_chat_claude_v1';
  const claudeReady = (async () => {
    if (!(window.claude && window.claude.use)) return null;
    try { SAMPLE = await window.claude.use('sample'); if (SAMPLE) SLIM = await SAMPLE.limits().catch(() => null); } catch (e) { SAMPLE = null; }
    return SAMPLE;
  })();
  const RULES = () => (window.MT_AGENT ? MT_AGENT.SYSTEM : '') + '\n\n## Как ты работаешь здесь\nТы встроен в страницу комплектатора; функции страницы доступны тебе как инструменты (каталог, расчёт, аналоги, 3D, КП). Вложения: изображения приходят картинками, PDF — картинками первых страниц и текстовым слоем, таблицы — текстом. Отвечай на русском, коротко, таблицы — в Markdown.';
  async function pdfForSample(file, maxImg) {
    if (!window.pdfjsLib) await new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'vendor/pdf.min.js'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise, blobs = [];
    let text = '';
    for (let p = 1; p <= pdf.numPages && p <= 40; p++) { const pg = await pdf.getPage(p); text += `\n--- стр. ${p} ---\n` + (await pg.getTextContent()).items.map(i => i.str).join(' '); }
    for (let p = 1; p <= Math.min(pdf.numPages, maxImg); p++) {
      const pg = await pdf.getPage(p), v0 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: Math.min(2.5, 1600 / Math.max(v0.width, v0.height)) });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      blobs.push(await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8)));
    }
    return { blobs, text: `Вложение: ${file.name} (PDF, ${pdf.numPages} стр.; первые ${blobs.length} — картинками)\nТекстовый слой:${text.slice(0, 40000)}` };
  }
  const ERR = { rate_limited: 'Достигнут лимит запросов вашего аккаунта Claude — попробуйте позже.', not_granted: 'Доступ страницы к Claude не разрешён. Обновите страницу и нажмите «Разрешить».',
    sampling_disabled: 'Claude недоступен для этого аккаунта.', session_expired: 'Войдите в Claude заново.', prompt_too_large: 'Слишком большой объём: начните новый диалог или пришлите меньше файлов.',
    image_rejected: 'Изображение не принято — попробуйте другой файл.', refused: 'Claude отказался отвечать на этот запрос — переформулируйте.', upstream_error: 'Связь с Claude прервалась — отправьте ещё раз.' };
  async function sendClaude(text) {
    busy = true; $('#send').disabled = true;
    const maxImg = SLIM && SLIM.images ? SLIM.images.maxCount : 0, images = [], parts = [];
    try {
      for (const f of atts) {
        const low = f.name.toLowerCase();
        if (f.type.startsWith('image/')) { if (images.length < maxImg) { images.push(f); parts.push(`[изображение: ${f.name}]`); } else parts.push(`[изображение ${f.name} не отправлено: лимит картинок]`); }
        else if (low.endsWith('.pdf')) { const r = await pdfForSample(f, Math.max(0, maxImg - images.length)); images.push(...r.blobs); parts.push(r.text); }
        else parts.push((await toBlocks(f)).filter(b => b.type === 'text').map(b => b.text).join('\n'));
      }
    } catch (e) { add('a', esc(e.message)); busy = false; $('#send').disabled = false; return; }
    add('u', esc(text || '') + (atts.length ? `<div class="att">📎 ${atts.map(a => esc(a.name)).join(', ')}</div>` : ''));
    $('#inp').value = ''; const sentAtts = atts; atts = []; drawAtts();
    cturns.push({ role: 'user', content: (parts.length ? parts.join('\n\n') + '\n\n' : '') + (text || 'Посмотри вложения.') });
    let turns = cturns.slice(); while (JSON.stringify(turns).length > 200000 && turns.length > 1) turns.shift();
    while (turns.length && turns[0].role !== 'user') turns.shift();
    let maxT = SLIM && SLIM.tools ? SLIM.tools.maxCount : 0;
    const defs = (window.MT_AGENT ? MT_AGENT.TOOLS : []).slice(0, maxT || 0);
    const tools = defs.map(d => ({ name: d.name, description: d.description.slice(0, 1000), inputSchema: d.input_schema,
      execute: input => { add('tool', '⚙ ' + esc(TOOL_LABEL[d.name] || d.name)); const out = TOOLS[d.name](input || {}); let r = JSON.stringify(out); if (r.length > 30000) r = r.slice(0, 30000) + '…'; return r; } }));
    let bubble = null; const wait = add('a', '<span class="typing"><i></i><i></i><i></i></span>', false);
    $('#status').textContent = 'думаю…';
    try {
      const opts = { cache: false, onText: ({ text: t }) => { wait.remove(); if (!bubble) bubble = add('a', '', false); bubble.innerHTML = md(t); $('#msgs').scrollTop = 1e9; } };
      if (tools.length) opts.tools = tools; if (images.length) opts.images = images;
      const res = await SAMPLE([{ role: 'user', content: RULES() }, ...turns], opts);
      cturns.push({ role: 'assistant', content: res.text });
      if (bubble) { log.push(['a', bubble.innerHTML]); } else add('a', md(res.text));
      if (res.truncated) add('tool', 'Ответ обрезан по длине — попросите продолжить.');
    } catch (e) {
      wait.remove();
      if (e && e.text && bubble) { bubble.innerHTML = md(e.text); log.push(['a', bubble.innerHTML]); cturns.push({ role: 'assistant', content: e.text }); }
      else { cturns.pop(); if (text && !$('#inp').value) $('#inp').value = text; atts = sentAtts; drawAtts(); }
      if (!e || e.code !== 'cancelled') add('a', '⚠ ' + esc(ERR[e && e.code] || ('Ошибка: ' + ((e && (e.message || e.code)) || e))));
    }
    wait.remove(); try { localStorage.setItem(CKEY, JSON.stringify({ cturns, log: log.slice(-200) })); } catch (e) { }
    busy = false; $('#send').disabled = false; $('#status').textContent = '';
  }

  async function send() {
    const text = $('#inp').value.trim(); if (busy || (!text && !atts.length)) return;
    if (await claudeReady) return sendClaude(text);
    if (!API) { add('a', md('На этом адресе ассистент не подключён к нейросети — откройте его как артефакт Claude или версию сайта на Vercel. Пока можно пользоваться страницей [Инструменты](tools.html): каталог, светорасчёт, аналоги, проверка КП.')); return; }
    busy = true; $('#send').disabled = true;
    const content = [];
    try { for (const f of atts) content.push(...await toBlocks(f)); } catch (e) { add('a', esc(e.message)); busy = false; $('#send').disabled = false; return; }
    if (text) content.push({ type: 'text', text });
    add('u', esc(text || '') + (atts.length ? `<div class="att">📎 ${atts.map(a => esc(a.name)).join(', ')}</div>` : ''));
    $('#inp').value = ''; atts = []; drawAtts();
    const snap = history.length;
    history.push({ role: 'user', content });
    const wait = add('a', '<span class="typing"><i></i><i></i><i></i></span>', false);
    try {
      for (let step = 0; step < 16; step++) {
        $('#status').textContent = step ? 'работаю…' : 'думаю…';
        const res = await callModel();
        history.push({ role: 'assistant', content: res.content });
        const texts = res.content.filter(b => b.type === 'text' && b.text.trim());
        if (texts.length) { wait.remove(); add('a', md(texts.map(b => b.text).join('\n\n'))); $('#msgs').appendChild(wait); }
        const uses = res.content.filter(b => b.type === 'tool_use');
        if (res.stop_reason !== 'tool_use' || !uses.length) break;
        const results = [];
        for (const u of uses) {
          add('tool', '⚙ ' + esc(TOOL_LABEL[u.name] || u.name), true);
          let out, isErr = false;
          try { out = TOOLS[u.name] ? TOOLS[u.name](u.input || {}) : { error: 'нет такого инструмента' }; } catch (e) { out = { error: e.message }; isErr = true; }
          let s = JSON.stringify(out); if (s.length > 40000) s = s.slice(0, 40000) + '…';
          results.push({ type: 'tool_result', tool_use_id: u.id, content: s, is_error: isErr || undefined });
        }
        history.push({ role: 'user', content: results });
        $('#msgs').appendChild(wait);
      }
    } catch (e) {
      add('a', '⚠ ' + esc(e.message) + '<div class="att">Сообщение можно отправить ещё раз.</div>');
      history = history.slice(0, snap); if (text && !$('#inp').value) $('#inp').value = text;
    }
    wait.remove(); persist(); busy = false; $('#send').disabled = false; $('#status').textContent = '';
  }
  $('#send').onclick = send;
  $('#inp').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
  $('#newChat').onclick = () => { history = []; cturns = []; log = []; persist(); try { localStorage.removeItem(CKEY); } catch (e) { } $('#msgs').innerHTML = ''; welcome(); };

  /* ---------- Старт ---------- */
  MTUI.renderKP($('#kpBox'), { compact: true });
  const t = () => $('#kpTitle').textContent = kp.get().title || 'КП'; kp.on(t); t();
  $('#v3dClose').onclick = () => { if (view3d) view3d.dispose(); view3d = null; $('#v3d').innerHTML = ''; $('#v3dCard').hidden = true; };
  $('#kpX').onclick = () => kp.exportXlsx(); $('#kpClr').onclick = e => { const b = e.target; if (b.dataset.sure) { kp.clear(); b.textContent = 'Очистить'; delete b.dataset.sure; } else { b.dataset.sure = 1; b.textContent = 'Точно очистить?'; setTimeout(() => { b.textContent = 'Очистить'; delete b.dataset.sure; }, 3000); } };
  try { const s = JSON.parse(localStorage.getItem(HKEY)); if (s && s.history && s.history.length) { history = s.history; log = s.log || []; } } catch (e) { }
  welcome(); for (const [k, h] of log) add(k, h, false);
  $('#status').textContent = 'загружаю каталог…';
  await MT.loadCatalog('data/catalog.json'); MTUI.loadPhotometry(); $('#status').textContent = '';
  if (window.HELP) HELP.setTab('assistant');
  if (await claudeReady) {
    try { const c = JSON.parse(localStorage.getItem(CKEY)); if (c && c.cturns) { cturns = c.cturns; if (!log.length) { log = c.log || []; for (const [k, h] of log) add(k, h, false); } } } catch (e) { }
    $('#banner').innerHTML = '<div class="note" style="margin-bottom:12px">Ассистент работает через ваш аккаунт Claude: при первом сообщении Claude спросит разрешение.</div>';
  } else if (!API) $('#banner').innerHTML = '<div class="note" style="margin-bottom:12px">На этом адресе ассистент не подключён к нейросети: он работает в версии сайта на Vercel (или укажите адрес прокси в <code>js/config.js</code>). Страница <a href="tools.html">Инструменты</a> работает здесь полностью.</div>';
  else fetch(API + '/health').then(r => r.json()).then(j => { if (j.access_code && !localStorage.getItem('maytoni_code')) askCode(); if (!j.key) $('#banner').innerHTML = '<div class="note" style="margin-bottom:12px">В прокси не задан ключ Claude API.</div>'; })
    .catch(() => { $('#banner').innerHTML = '<div class="note" style="margin-bottom:12px">Прокси недоступен (на Vercel проверьте, что проект развёрнут). Пока работает страница <a href="tools.html">Инструменты</a>.</div>'; });
})();
</script>
